name: E2E (Playwright)

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Testes ponta a ponta (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: controle-financeiro-web

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: controle-financeiro-web/package-lock.json

      - name: Instalar as dependências
        run: npm ci

      - name: Instalar dependências do servidor
        working-directory: back4app/cloud
        run: npm ci

      - name: Verificar credenciais privadas
        working-directory: .
        run: node scripts/check-secrets.mjs

      - name: Validar cálculos e build
        run: |
          npm run teste
          npm run build -- --mode test
          npm audit --omit=dev

      - name: Validar servidor e dependências de produção
        working-directory: back4app/cloud
        run: |
          npm test
          npm audit --omit=dev

      - name: Instalar o navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar os testes E2E
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Validar integração de tela sem rede real
        run: npx playwright test tests/cobranca-conectada.spec.ts
        env:
          CI: 'true'
          E2E_BILLING: '1'
          VITE_BILLING_API_URL: https://billing.example.invalid
          VITE_BACK4APP_APP_ID: fake-app
          VITE_BACK4APP_JAVASCRIPT_KEY: fake-key

      - name: Preparar Java para emuladores
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validar regras e concorrência em banco isolado
        working-directory: .
        run: npx --yes firebase-tools@14.19.1 emulators:exec --config firebase.validation.json --project demo-planeja-validation --only firestore,auth "node --test controle-financeiro-web/validation/firestore.test.mjs"

      - name: Publicar o relatório
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: controle-financeiro-web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
