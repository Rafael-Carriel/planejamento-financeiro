name: E2E (Playwright)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Testes ponta a ponta (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: controle-financeiro-web

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: controle-financeiro-web/package-lock.json

      - name: Instalar as dependências
        run: npm ci

      - name: Instalar o navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Rodar os testes E2E
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Publicar o relatório
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: controle-financeiro-web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
