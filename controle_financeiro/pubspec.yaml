# ---------------------------------------------------------------------------
# As versões abaixo são pontos de partida. Depois de rodar `flutter create`,
# execute `flutter pub upgrade --major-versions` para resolver tudo nas
# versões atuais compatíveis com o seu Flutter SDK.
# ---------------------------------------------------------------------------
name: controle_financeiro
description: Controle financeiro pessoal - registre entradas e saídas, acompanhe o saldo do mês e veja para onde vai seu dinheiro.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.7.0  # Flutter 3.29 ou superior

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # Estado e formatação
  provider: ^6.1.2
  # Sem versão fixa de propósito: quem define a versão do intl é o
  # flutter_localizations, que vem junto com o seu Flutter SDK.
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
